{% load static %}
<!doctype html>
<html lang="en-gb">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block head_title %}Grasp{% endblock %}</title>
    <!-- HTMX -->
    <script src="{% static 'js/htmx.2.0.8.min.js' %}"></script>
    <!-- Tailwind -->
    <link href="{% static 'css/tailwind.css' %}" rel="stylesheet" />
  </head>
  <!-- This should be enough to make POST calls -->
  <body class="m-10" hx-headers='{"x-csrftoken": "{{ csrf_token }}"}'>
  {% block content %} {% endblock %}
  </body>
</html>
