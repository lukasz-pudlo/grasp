{% extends "base.html" %} {% block title %}{{ book.title }}{% endblock %}
{% block content %}
    <div class="grid grid-flow-col grid-rows-20 bg-reclam-yellow h-screen overflow-y-scroll">
        <div>
        </div>
        <div class="row-span-4">
            <div class="grid grid-cols-10">
                <div>
                </div>
                <div class="col-span-8 bg-reclam-white border-b-10">
                    <p class="mt-4 text-4xl leading-none tracking-tight ml-2 font-[DocumentaSTRegular]">
                        {{ book.get_authors }}
                    </p>
                    <p class="mt-2 ml-2 mb-20 text-4xl leading-none tracking-tight font-[DocumentaSTRegular]">
                        {{ book.title }}
                    </p>
                <div>
                </div>
            </div>
        </div>
        <div class="row-span-15">
            {% for fragment in text_fragments %}
            <div class="mt-10 ml-10 mr-10">
                <p>
                    {{ fragment.text }}
                </p>
            </div>
            {% endfor %}
        </div>
    </div>

{% endblock %}
