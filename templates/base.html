{% load static %}
<!doctype html>
<html class="bg-white dark:bg-black"" lang="en-gb">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block head_title %}Grasp{% endblock %}</title>
    <!-- HTMX -->
    <script src="{% static 'js/htmx.2.0.8.min.js' %}" defer></script>
    <!-- Alpine -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Tailwind -->
    <link href="{% static 'css/tailwind.css' %}" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/hyperscript.org@0.9.91/dist/_hyperscript.min.js" integrity="sha384-OT9bNmUa5rM34SmxFpRftn2F6GbgM/4xnTmn0z106OE5uvsigkdtUMOpdPKOigyO" crossorigin="anonymous"></script>
  </head>
  <!-- This should be enough to make POST calls -->
  <body hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
    <nav class="navbar shadow-sm bg-reclam-yellow">
      <a href="{% url 'index' %}" class="btn btn-neutral bg-reclam-blue text-xl text-black mr-1">Home</a>
      <a href="{% url 'books:book-list' %}" class="btn btn-neutral bg-reclam-blue text-black text-xl">Books</a>
    </nav>
    <div class="max-w-5xl mx-auto p-4 m-10">
      {% block content %} {% endblock %}
    </div>
  </body>
</html>
