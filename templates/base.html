{% load static %}
<!doctype html>
<html class="bg-white dark:bg-black"" lang="en-gb">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block head_title %}Grasp{% endblock %}</title>
    <!-- HTMX -->
    <script src="{% static 'js/htmx.2.0.8.min.js' %}" defer></script>
    <!-- Tailwind -->
    <link href="{% static 'css/tailwind.css' %}" rel="stylesheet" />
  </head>
  <!-- This should be enough to make POST calls -->
  <body hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
    <div class="navbar bg-base-100 shadow-sm bg-reclam-yellow border-0">
      <a href="{% url 'index' %}" class="btn btn-neutral text-xl mr-1">Home</a>
      <a href="{% url 'books:book-list' %}" class="btn btn-neutral text-xl">Books</a>
    </div>
    <div class="max-w-5xl mx-auto p-4 m-10">
      {% block content %} {% endblock %}
    </div>
  </body>
</html>
